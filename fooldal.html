<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="CSS/fooldal.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Főoldal</title>
</head>
<body>
    <div class="container text-center py-5">
        <h1 id="cim">Játék kiválasztása</h1>
        <div class="row justify-content-center g-4 Valasztas">
                <div class="col-6 col-md-4 col-lg-3 d-flex flex-column align-items-center">
                    <img src="IMG/Fooldal/dobokockaValasztas.png" class="img-fluid szegely" alt="Dobókocka játék" title="Dobókocka játék">
                    <button id="DobokockaButton" class="btn btn-primary btn-lg px-3 gomb mt-3">Dobókocka játék</button>
                </div>
                <div class="col-6 col-md-4 col-lg-3 d-flex flex-column align-items-center">
                    <img src="IMG/Fooldal/kiNevetAVegen.png" class="img-fluid szegely" alt="Ki nevet a végén?" title="Ki nevet a végén?">
                    <button id="KiNevetAVegenButton" class="btn btn-primary btn-lg px-3 gomb mt-3">Ki nevet a végén?</button>
                </div>
        </div>
    </div>

<script src="JS/fooldal.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
